name: Verify container-free VM
on:
  pull_request:
    paths:
      [
        'vm-runner/**',
        'src/qemu-vm.ts',
        'src/runner*.ts',
        '.github/workflows/prepare-vm.yml',
        'package*.json',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts
      - name: Install trusted VM preparation tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap debian-archive-keyring qemu-system-x86 e2fsprogs
      - name: Prepare guest without submission code
        run: mkdir -p vm-runner/images && sudo bash vm-runner/build-image.sh vm-runner/images
      - name: Exercise bounded synthetic isolation canary
        env:
          VM_DISK: vm-runner/images/root.raw
          VM_KERNEL: vm-runner/images/kernel
          VM_INITRD: vm-runner/images/initrd
        shell: bash
        run: npm run runner:vm:smoke 2>&1 | tee vm-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-vm-evidence
          path: vm-evidence.txt
          retention-days: 7
      - name: Retain prepared image briefly for operator release provisioning
        run: gzip -k vm-runner/images/root.raw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-vm-image
          path: |
            vm-runner/images/root.raw.gz
            vm-runner/images/kernel
            vm-runner/images/initrd
          retention-days: 1
          compression-level: 0

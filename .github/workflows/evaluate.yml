name: Execute isolated submission VM
run-name: VM attempt ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Immutable Cloudflare attempt ID
        required: true
        type: string
      judge_origin:
        description: Allowlisted judge origin / OIDC audience
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    # Includes trusted package/image setup. The claimed attempt retains its
    # independent 12-minute deadline and the guest its frozen execution budget.
    timeout-minutes: 20
    # No Actions concurrency group: every attempt retains its own queued job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: npm run runner:vm:bundle
      - name: Fetch immutable prepared guest
        env:
          VM_RELEASE: ${{ vars.RUNNER_VM_RELEASE }}
          VM_IMAGE: ${{ vars.RUNNER_VM_IMAGE }}
          VM_REPOSITORY: ${{ github.repository }}
        run: node vm-runner/download-image.mjs
      - name: Execute and report using GitHub OIDC
        env:
          JUDGE_ORIGIN: ${{ inputs.judge_origin }}
          JUDGE_JOB_ID: ${{ inputs.job_id }}
          ALLOWED_JUDGE_ORIGIN: ${{ vars.RUNNER_JUDGE_ORIGIN }}
          VM_DISK: vm-runner/images/root.raw
          VM_KERNEL: vm-runner/images/kernel
          VM_INITRD: vm-runner/images/initrd
        run: node vm-runner/actions-host.mjs

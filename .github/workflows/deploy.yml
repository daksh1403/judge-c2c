name: Cloudflare deployment
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-review
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      # No production bindings or application secrets. Unique Worker and Workflow
      # per PR; review fixtures never query D1 or accept mutations.
      - name: Generate isolated preview configuration
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/preview-config.mjs
      - run: npx wrangler deploy --config .wrangler/pr-review.json
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed preview
        env:
          REVIEW_URL: https://judge-c2c-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
        run: npm run test:browser
      - name: Record preview URL
        run: echo 'Preview https://judge-c2c-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev' >> "$GITHUB_STEP_SUMMARY"
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/production-config.mjs
        env:
          PRODUCTION_DATABASE_ID: ${{ vars.PRODUCTION_DATABASE_ID }}
          PRODUCTION_ORG_DATABASE_ID: ${{ vars.PRODUCTION_ORG_DATABASE_ID }}
          PRODUCTION_ARTIFACT_BUCKET: ${{ vars.PRODUCTION_ARTIFACT_BUCKET }}
          PRODUCTION_ARTIFACT_KV_ID: ${{ vars.PRODUCTION_ARTIFACT_KV_ID }}
          PRODUCTION_ORG_NAME: ${{ vars.PRODUCTION_ORG_NAME }}
          PRODUCTION_ORG_PUBLIC_ORIGIN: ${{ vars.PRODUCTION_ORG_PUBLIC_ORIGIN }}
          PRODUCTION_AI_PROVIDER: ${{ vars.PRODUCTION_AI_PROVIDER }}
          PRODUCTION_AI_MODEL: ${{ vars.PRODUCTION_AI_MODEL }}
          PRODUCTION_RUNNER_ENDPOINT: ${{ vars.PRODUCTION_RUNNER_ENDPOINT }}
          PRODUCTION_RUNNER_IMAGE: ${{ vars.PRODUCTION_RUNNER_IMAGE }}
          PRODUCTION_RUNNER_MODE: ${{ vars.PRODUCTION_RUNNER_MODE }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      - run: npx wrangler d1 migrations apply DB --config .wrangler/production.json --remote
      - run: npx wrangler d1 migrations apply ORG_DB --config .wrangler/production.json --remote
      - run: npx wrangler deploy --config .wrangler/production.json
